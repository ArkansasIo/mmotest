<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Subsystem</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.slide-container{width:1280px;min-height:720px;background:#06121d;color:#d9f7ff;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;padding:74px 88px 0}
.grid{position:absolute;right:70px;top:78px;width:470px;min-height:500px;border:1px solid #18516b;background:linear-gradient(90deg,transparent 49.7%,#18516b 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#18516b 50%,transparent 50.3%);background-size:118px 118px;opacity:.55}
.grid:before,.grid:after{content:"";position:absolute;border:2px solid #28c9ee}
.grid:before{width:230px;min-height:230px;left:118px;top:118px;transform:rotate(45deg)}
.grid:after{width:92px;min-height:92px;left:188px;top:188px;border-color:#78edff}
.eyebrow{font-size:15px;letter-spacing:4px;color:#86b9c8;margin-bottom:38px}
h1{font-size:70px;line-height:1.02;letter-spacing:-2px;color:#78edff;max-width:650px}
.subtitle{font-size:25px;line-height:1.35;color:#d9f7ff;margin-top:28px;max-width:570px}
.rule{width:150px;height:4px;background:#28c9ee;margin-top:42px}
.meta{position:absolute;left:88px;bottom:62px;color:#86b9c8;font-size:16px;letter-spacing:1px}
.corner{position:absolute;right:88px;bottom:62px;color:#28c9ee;font-size:14px;letter-spacing:2px}
</style>
</head>
<body>
<div class="slide-container">
  <div class="grid"></div>
  <div class="eyebrow">UNIVERSE CIVILIZATION: EMPIRE AT WARS</div>
  <h1>Construction<br>Subsystem</h1>
  <p class="subtitle">Contracts, secure queue mechanics, and validation results</p>
  <div class="rule"></div>
  <div class="meta">COMMAND SYSTEMS · TECHNICAL SUMMARY</div>
  <div class="corner">BUILD 2026.08</div>
</div>
</body>
</html>
